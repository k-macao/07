name: DeepSeek 手动分析

on:
  workflow_dispatch:
    inputs:
      stock_list:
        description: '自选股代码（逗号分隔，如 600519,300750）'
        required: true
        default: '600519'
      analysis_mode:
        description: '分析模式（full / market-only / stocks-only）'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      report_length:
        description: '报告字数目标（长报告支持分段推送）'
        required: false
        default: '100000'

jobs:
  deepseek-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 执行分析（调用系统分析框架 + DeepSeek）
        env:
          STOCK_LIST: ${{ github.event.inputs.stock_list }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          mkdir -p reports
          python main.py --mode ${{ github.event.inputs.analysis_mode }} --output-dir reports/
      - name: 生成并推送报告（支持长内容分段推送到 PushPlus 微信）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python scripts/pushplus_push_report.py --dir reports/ --max-chars 100000 --channel pushplus
      - uses: actions/upload-artifact@v6
        with:
          name: deepseek-reports
          path: reports/
