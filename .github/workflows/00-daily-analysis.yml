name: daily-stock-analysis

on:
  schedule:
    - cron: '0 1 * * 1-6'
  workflow_dispatch:

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: mkdir -p data logs reports
      - name: analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS }}
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || 'sh000001' }}
          USE_LATEST_TRADING_DAY: 'true'
          MARKET_REVIEW_ENABLED: 'true'
          TRADING_DAY_CHECK_ENABLED: 'true'
          MAX_WORKERS: '1'
          LOG_LEVEL: INFO
          RSS_NEWS_ENABLED: ${{ vars.RSS_NEWS_ENABLED || 'true' }}
          RSSHUB_BASE_URL: ${{ vars.RSSHUB_BASE_URL || 'https://rsshub.app' }}
          RSS_NEWS_PER_FEED: '8'
        run: python main.py
      - name: push-wechat-magazine
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
        run: python scripts/pushplus_push_report.py --dir reports/ --channel pushplus
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
